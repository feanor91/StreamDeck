name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version à publier dans Releases (ex. v0.2.1). Laisser vide pour une simple compilation.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  windows-agent:
    name: Agent Windows (envoi des touches)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Démarrer le serveur et tester l'agent PowerShell
        shell: pwsh
        run: |
          $server = Start-Process node -ArgumentList 'server/index.js' -PassThru -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server.err
          try {
            node scripts/smoke.mjs --send
            if ($LASTEXITCODE -ne 0) { throw "Test de fumée en échec" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Content server.log, server.err -ErrorAction SilentlyContinue
          }

  android:
    name: Application Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamdeck.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/streamdeck.jks" >> "$GITHUB_ENV"
            echo "APK signé avec la clé du dépôt."
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : une version publiée doit être signée avec la clé fixe (voir README)."
            exit 1
          else
            echo "::warning::Pas de clé de signature : APK signé avec une clé de débogage temporaire."
          fi
      - name: Compiler l'APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Renommer l'APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/StreamDeck-Android-$VERSION.apk"
      - name: Vérifier la signature de l'APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs out/*.apk | grep -E "Verified using v[12]|certificate SHA-256|DN:"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Android
          path: out/*.apk
          if-no-files-found: error

  desktop:
    name: Application PC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml et .blockmap : lus par l'application installée pour se mettre à jour.
          - os: windows-latest
            dist: dist:win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
            name: StreamDeck-Windows
          - os: ubuntu-latest
            dist: dist:linux
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
            name: StreamDeck-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test de démarrage de l'application (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npx electron . --no-sandbox > electron.log 2>&1 &
          # Mode simulation indisponible ici : xdotool absent, on vérifie seulement que le serveur intégré répond.
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3210/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:3210/api/status > /dev/null || (cat electron.log; exit 1)
          curl -sf http://127.0.0.1:3210/ | grep -q "Gestion des touches"
          echo "Application PC démarrée, serveur intégré opérationnel."
      - name: Empaqueter
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Vérifier que la liaison MSFS est embarquée
        shell: bash
        run: |
          ASAR=$(ls dist/*-unpacked/resources/app.asar)
          # Sous Windows, la liste utilise des « \ » : on normalise les séparateurs.
          npx --yes @electron/asar list "$ASAR" | tr '\\' '/' > asar.txt
          grep -q "node_modules/node-simconnect/dist/index.js" asar.txt
          grep -q "public/icons/avia/gear-down.svg" asar.txt
          echo "node-simconnect et icônes aviation présents dans $ASAR"
          ls dist/*-unpacked/resources/app.asar.unpacked/node_modules/regedit/vbs | head -3
      - name: Vérifier les fichiers de mise à jour automatique
        shell: bash
        run: |
          ls dist/*-unpacked/resources/app-update.yml
          cat dist/latest*.yml
          grep -q "node_modules/electron-updater/" asar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [test, windows-agent, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Sur un lancement manuel, l'étiquette est créée sur le commit compilé.
          tag_name: ${{ inputs.release || github.ref_name }}
          name: StreamDeck ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
